<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlumnosDB — Panel de Gestión</title>
  <meta name="description" content="Sistema futurista de gestión de alumnos con API REST y MySQL" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/styles/style.css" />
</head>
<body>

  <!-- ═══ Fondo animado ═══ -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--1" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--2" aria-hidden="true"></div>

  <!-- ═══ Header ═══ -->
  <header id="main-header">
    <div class="container header-content">
      <a href="/" class="logo" aria-label="Inicio">
        <svg class="logo-icon" viewBox="0 0 40 40" width="36" height="36">
          <polygon points="20,2 37,11 37,29 20,38 3,29 3,11"
                   fill="none" stroke="url(#grad)" stroke-width="2.5"/>
          <polygon points="20,10 29,15 29,25 20,30 11,25 11,15"
                   fill="url(#grad)" opacity="0.25"/>
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"   style="stop-color:var(--accent-primary)" />
              <stop offset="100%" style="stop-color:var(--accent-secondary)" />
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">Alumnos<strong>DB</strong></span>
      </a>

      <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
        <!-- Sol (light) -->
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1"  x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22"  x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1"  y1="12" x2="3"  y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <!-- Luna (dark) -->
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3
                   7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ═══ Main ═══ -->
  <main class="container">

    <!-- ── Stats ── -->
    <section class="stats-bar" aria-label="Estadísticas">
      <div class="stat-card">
        <span class="stat-number" id="total-alumnos">0</span>
        <span class="stat-label">Total Alumnos</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="edad-promedio">0</span>
        <span class="stat-label">Edad Promedio</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="ultimo-id">—</span>
        <span class="stat-label">Último ID</span>
      </div>
    </section>

    <!-- ── Formulario ── -->
    <section class="card form-section" id="form-section">
      <div class="card-header">
        <h2>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
          Registrar Alumno
        </h2>
        <span class="card-badge">NUEVO</span>
      </div>

      <form id="alumno-form" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre"
                   placeholder="Ej: Juan" autocomplete="given-name" maxlength="30" required />
            <span class="field-error" id="nombre-error"></span>
          </div>
          <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido"
                   placeholder="Ej: Pérez" autocomplete="family-name" maxlength="30" required />
            <span class="field-error" id="apellido-error"></span>
          </div>
          <div class="form-group">
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad"
                   placeholder="Ej: 22" min="1" max="120" required />
            <span class="field-error" id="edad-error"></span>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <span id="submit-btn-text">Agregar Alumno</span>
          </button>
          <button type="button" id="cancel-btn" class="btn-secondary hidden">
            Cancelar
          </button>
        </div>
      </form>
    </section>

    <!-- ── Tabla ── -->
    <section class="card table-section" id="table-section">
      <div class="card-header">
        <h2>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="3" y1="9"  x2="21" y2="9"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
            <line x1="9" y1="3"  x2="9"  y2="21"/>
          </svg>
          Lista de Alumnos
        </h2>
        <button id="refresh-btn" class="btn-icon-only" aria-label="Actualizar lista">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>
      </div>

      <div class="table-wrapper">
        <table id="alumnos-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Edad</th>
              <th>Modificar</th>
            </tr>
          </thead>
          <tbody id="alumnos-tbody">
            <!-- Renderizado por app.js -->
          </tbody>
        </table>
      </div>

      <!-- Estado vacío -->
      <div id="empty-state" class="empty-state hidden">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
             opacity="0.4">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <p class="empty-title">Sin registros</p>
        <p class="empty-sub">Usá el formulario de arriba para agregar alumnos.</p>
      </div>

      <!-- Loading -->
      <div id="loading-state" class="loading-state hidden">
        <div class="spinner"></div>
        <p>Cargando datos…</p>
      </div>
    </section>
  </main>

  <!-- ═══ Toast ═══ -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- ═══ Footer ═══ -->
  <footer id="main-footer">
    <div class="container">
      <p>AlumnosDB &copy; 2026 &mdash; API REST &bull; MySQL &bull; Express</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/theme/context.js"></script>
  <script src="/script/app.js"></script>
</body>
</html>
